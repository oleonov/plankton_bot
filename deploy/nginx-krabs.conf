# Replace bot.example.com with your domain (and issue a certificate for it with certbot).
# HTTP → HTTPS redirect
server {
    listen 80;
    server_name bot.example.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS — proxy to krabs-api container on port 3100
server {
    listen 443 ssl http2;
    server_name bot.example.com;

    ssl_certificate /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    access_log /var/log/nginx/krabs-access.log;
    error_log /var/log/nginx/krabs-error.log;

    # SSE-aware: long timeouts, no buffering
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;

    # SSE endpoint — needs special treatment
    location /api/v1/events {
        proxy_pass http://127.0.0.1:3100;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Connection "";
    }

    # All other routes
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_read_timeout 120s;
    }
}
