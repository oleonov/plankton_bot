services:
  plankton-runtime:
    image: plankton:latest
    command: ["node", "apps/runtime/dist/index.js"]
    working_dir: /app
    volumes:
      - plankton-data:/app/apps/runtime/data
      - ./config:/app/config:ro
    restart: unless-stopped
    env_file: .env.production
    mem_limit: 450m
    environment:
      - NODE_OPTIONS=--max-old-space-size=384

  plankton-discovery:
    image: plankton:latest
    command: ["node", "apps/discovery/dist/worker.js"]
    working_dir: /app
    volumes:
      - plankton-data:/app/apps/runtime/data
      - ./config:/app/config:ro
    restart: unless-stopped
    depends_on:
      - plankton-runtime
    env_file: .env.production
    mem_limit: 768m
    environment:
      - NODE_OPTIONS=--max-old-space-size=640

  plankton-api:
    image: plankton:latest
    command: ["node", "apps/api/dist/index.js"]
    working_dir: /app
    ports:
      - "3100:3100"
    volumes:
      - plankton-data:/app/apps/runtime/data
      - ./config:/app/config:ro
    restart: unless-stopped
    depends_on:
      - plankton-runtime
    env_file: .env.production
    mem_limit: 256m
    environment:
      # Always behind nginx in production
      - TRUST_PROXY=true
      - NODE_OPTIONS=--max-old-space-size=192
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3100/api/v1/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Minimal Docker socket proxy — only allows container inspect/stop/start.
  # No exec, no images, no volumes, no networks, no build.
  # Known limitation: proxy restricts by API section, not by container ID.
  # If runtime-manager is compromised, it can stop/start any container on the
  # daemon — not just MANAGED_CONTAINER. This is accepted as a residual risk
  # since per-container ACLs aren't supported by HAProxy-based proxies.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - POST=1
      # Everything else stays at default 0 (denied):
      # AUTH, BUILD, COMMIT, CONFIGS, DISTRIBUTION, EXEC, GRPC,
      # IMAGES, INFO, NETWORKS, NODES, PLUGINS, SECRETS, SERVICES,
      # SESSION, SWARM, SYSTEM, TASKS, VOLUMES = 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - manager-net

  plankton-runtime-manager:
    image: plankton:latest
    command: ["node", "apps/runtime-manager/dist/index.js"]
    working_dir: /app
    volumes:
      - plankton-data:/app/apps/runtime/data
      # No docker.sock mount — connects via proxy
    restart: unless-stopped
    depends_on:
      plankton-runtime:
        condition: service_started
      docker-socket-proxy:
        condition: service_healthy
    env_file: .env.production
    mem_limit: 192m
    environment:
      - CONTROL_DB_PATH=/app/apps/runtime/data/control.db
      - MANAGED_CONTAINER=plankton-plankton-runtime-1
      - POLL_INTERVAL_MS=3000
      - RESTART_TIMEOUT_S=30
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - NODE_OPTIONS=--max-old-space-size=128
    networks:
      - default
      - manager-net

volumes:
  plankton-data:
    name: plankton-data

networks:
  manager-net:
    internal: true
