services:
  plankton-runtime:
    image: plankton:latest
    command: ["node", "apps/runtime/dist/index.js"]
    working_dir: /app
    volumes:
      - plankton-data:/app/apps/runtime/data
      - ./config:/app/config:ro
    restart: unless-stopped
    env_file: .env.production

  plankton-discovery:
    image: plankton:latest
    command: ["node", "apps/discovery/dist/worker.js"]
    working_dir: /app
    volumes:
      - plankton-data:/app/apps/runtime/data
      - ./config:/app/config:ro
    restart: unless-stopped
    depends_on:
      - plankton-runtime
    env_file: .env.production

  plankton-api:
    image: plankton:latest
    command: ["node", "apps/api/dist/index.js"]
    working_dir: /app
    ports:
      - "3100:3100"
    volumes:
      - plankton-data:/app/apps/runtime/data
      - ./config:/app/config:ro
    restart: unless-stopped
    depends_on:
      - plankton-runtime
    env_file: .env.production
    environment:
      # Always behind nginx in production
      - TRUST_PROXY=true
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3100/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  plankton-runtime-manager:
    image: plankton:latest
    command: ["node", "apps/runtime-manager/dist/index.js"]
    working_dir: /app
    user: "0:0"
    volumes:
      - plankton-data:/app/apps/runtime/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - plankton-runtime
    env_file: .env.production
    environment:
      - CONTROL_DB_PATH=/app/apps/runtime/data/control.db
      - MANAGED_CONTAINER=plankton-plankton-runtime-1
      - POLL_INTERVAL_MS=3000
      - RESTART_TIMEOUT_S=30

volumes:
  plankton-data:
    name: plankton-data
